title: "Karthi"
description: "Engineer • Developer • Scientific Thinker"
baseurl: ""
url: "https://kaarthi.github.io"

markdown: kramdown
theme: null

collections:
  posts:
    output: true
  projects:
    output: true
    source: projects
    permalink: /projects/:path/

exclude:
  - projects/_template

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "projects"
